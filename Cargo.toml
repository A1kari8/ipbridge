[package]
name = "ipbridge"
version = "0.1.6"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
env_logger = "0.11.8"
log = "0.4.28"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.7"
futures = "0.3.31"
dashmap = "6.1.0"
clap = { version = "4.5.4", features = ["derive"] }
bytes = "1"
crossbeam-queue = "0.3"

[dependencies.tokio]
version = "1.47.1"
features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal"]

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
