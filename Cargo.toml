[package]
name = "ipbridge"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
env_logger = "0.11.10"
log = "0.4.32"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
clap = { version = "4.6.1", features = ["derive"] }
socket2 = "0.6"

[dependencies.tokio]
version = "1.52.3"
features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
